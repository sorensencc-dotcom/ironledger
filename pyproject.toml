[project]
name = "ironledger"
version = "0.0.0"
description = "Local-first, single-operator financial OS. Beancount is the sole accounting authority; SQLite is a disposable projection."
requires-python = ">=3.12"
dependencies = ["ofxtools==1.1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ironledger = "ironledger.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ironledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require external tools or binaries like bean-check",
]

[tool.ironledger]
# Phase 3: the compilation pipeline is authorized and shipped
# (ironledger compile / compile status / compile recover). Projection, MCP, and
# network code remain out of scope.
phase = 3
