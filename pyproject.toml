[project]
name = "ironledger"
version = "0.0.0"
description = "Local-first, single-operator financial OS. Beancount is the sole accounting authority; SQLite is a disposable projection."
requires-python = ">=3.12"
dependencies = [
    "ofxtools==1.1.1",
    "pypdf==6.1.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "starlette>=0.38.0",
    "cryptography>=42.0.0",
    "jsonschema>=4.20.0",
    "keyring>=24.0.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # bean-check CLI only. src/ironledger must never `import beancount`.
    "beancount==3.2.3",
]

[project.scripts]
ironledger = "ironledger.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ironledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::PendingDeprecationWarning:starlette.*",
]
markers = [
    "integration: marks tests that require external tools or binaries like bean-check",
]

[tool.ironledger]
# Phase 5: compile and projection are authorized and shipped
# (ironledger compile / project / search / balances). MCP and
# network code remain out of scope.
phase = 5
