version: '3.8'

services:
  ironledger:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ironledger:enterprise-latest
    container_name: ironledger-node
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8000:8000"
    volumes:
      - ironledger-data:/app/data
      - ironledger-keys:/app/.ironledger
      - ../config:/app/config:ro
    environment:
      - IRONLEDGER_DB_PATH=/app/data/ironledger.db
      - IRONLEDGER_PROJECTION_DB_PATH=/app/data/projection.db
      - IRONLEDGER_CONFIG_DIR=/app/config
      - IRONLEDGER_KEY_PROVIDER=env
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ironledger-data:
    driver: local
  ironledger-keys:
    driver: local
