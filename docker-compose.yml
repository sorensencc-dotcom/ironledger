services:
  ironledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironledger-workbench
    restart: always
    ports:
      - "${IRONLEDGER_HOST_PORT:-8000}:8000"
    volumes:
      # Repo root is /data. The image defaults to /app/data and /app/config,
      # which are not this mount — CLI imports on the host would be invisible.
      #
      # WARNING: this container and the host `ironledger` CLI share the same
      # ironledger.db through this bind mount. SQLite's WAL journal mode
      # (this app's default) is documented as unsafe over non-local
      # filesystems, and a Docker Desktop bind mount on Windows behaves like
      # one for locking purposes. Writing from both sides at once corrupted
      # this database once already (2026-09-24, recovered via `sqlite3
      # .recover`; see .recovery-work/, git-ignored). The CLI now warns
      # (src/ironledger/cli/compose_guard.py) when it detects this service
      # running, but the safe pattern is: `docker compose down` before host
      # CLI writes, or `docker compose exec ironledger ironledger ...`.
      - .:/data
    environment:
      - PYTHONUNBUFFERED=1
      - IRONLEDGER_DB_PATH=/data/ironledger.db
      - IRONLEDGER_LEDGER_DIR=/data/ledger-vault
      - IRONLEDGER_PROJECTION_DIR=/data/projection
      - IRONLEDGER_PROJECTION_DB_PATH=/data/projection/projection.sqlite
      - PYTHONPATH=/data/src
      - IRONLEDGER_CONFIG_DIR=/data/config
      - IRONLEDGER_OP_TOKEN=${IRONLEDGER_OP_TOKEN:-d0-localhost-token}
      - IRONLEDGER_SIMPLEFIN_ACCESS_URL=${IRONLEDGER_SIMPLEFIN_ACCESS_URL:-}
