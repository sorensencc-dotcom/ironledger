services:
  ironledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironledger-workbench
    restart: always
    ports:
      - "${IRONLEDGER_HOST_PORT:-8000}:8000"
    volumes:
      # Repo root is /data. The image defaults to /app/data and /app/config,
      # which are not this mount — CLI imports on the host would be invisible.
      - .:/data
    environment:
      - PYTHONUNBUFFERED=1
      - IRONLEDGER_DB_PATH=/data/ironledger.db
      - IRONLEDGER_LEDGER_DIR=/data/ledger
      - IRONLEDGER_PROJECTION_DIR=/data/projection
      - IRONLEDGER_PROJECTION_DB_PATH=/data/projection/projection.sqlite
      - PYTHONPATH=/data/src
      - IRONLEDGER_CONFIG_DIR=/data/config
      - IRONLEDGER_OP_TOKEN=${IRONLEDGER_OP_TOKEN:-d0-localhost-token}
      - IRONLEDGER_SIMPLEFIN_ACCESS_URL=${IRONLEDGER_SIMPLEFIN_ACCESS_URL:-}
