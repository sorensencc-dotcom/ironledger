services:
  ironledger:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ironledger-workbench
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
    ports:
      - "${IRONLEDGER_HOST_PORT:-8000}:8000"
    volumes:
      # Code, evidence, config, and plaintext ledger stay on the repository mount.
      # SQLite lives on native Docker storage to avoid Windows bind-mount corruption.
      # Run database-writing CLI commands with docker compose exec, not on the host.
      - .:/data
      - ironledger-database:/var/lib/ironledger
    environment:
      - PYTHONUNBUFFERED=1
      - IRONLEDGER_DB_PATH=/var/lib/ironledger/ironledger.db
      - IRONLEDGER_LEDGER_DIR=/data/ledger-vault
      - IRONLEDGER_PROJECTION_DIR=/data/projection
      - IRONLEDGER_PROJECTION_DB_PATH=/data/projection/projection.sqlite
      - PYTHONPATH=/data/src
      - IRONLEDGER_CONFIG_DIR=/data/config
      - IRONLEDGER_OP_TOKEN=${IRONLEDGER_OP_TOKEN:-d0-localhost-token}
      - IRONLEDGER_INBOUND_EMAIL_SECRET=${IRONLEDGER_INBOUND_EMAIL_SECRET:-}
      # Runtime database lives on native Docker storage; host CLI must not write its old copy.
      - IRONLEDGER_JOURNAL_MODE=DELETE
      - IRONLEDGER_SIMPLEFIN_ACCESS_URL=${IRONLEDGER_SIMPLEFIN_ACCESS_URL:-}

volumes:
  ironledger-database:
    external: true
    name: ironledger-database
