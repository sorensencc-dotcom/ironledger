document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor-border-accent:    var(--ember);    /* left-border pull quotes */\n\n  --color-accent-bg-tint:   rgba(139, 58, 26, 0.06);  /* pull quote bg */\n  --color-overlay-fade:     rgba(10, 8, 6, 0.88);\n\n  /* Status colors (archive portal) */\n  --color-status-live:      #5a9e6f;\n  --color-status-progress:  var(--brass);\n  --color-status-soon:      var(--ash);\n\n  /* Tag colors */\n  --color-tag-high:         var(--ember);\n  --color-tag-medium:       #7a9fbf;\n  --color-tag-new:          var(--brass);\n  --color-tag-corrected:    var(--ember);\n\n  /* ── TYPOGRAPHY TOKENS ───────────────────────────────────── */\n  --font-display:    'Playfair Display', Georgia, serif;\n  --font-body:       'Libre Baskerville', Georgia, serif;\n  --font-ui:         'Barlow Condensed', sans-serif;\n\n  /* Type scale */\n  --text-hero:       clamp(4rem, 10vw, 9rem);\n  --text-h1:         clamp(2.5rem, 5vw, 4.5rem);\n  --text-h2:         clamp(2rem, 4vw, 3.5rem);\n  --text-h3:         clamp(1.8rem, 3vw, 3.2rem);\n  --text-h4:         1.6rem;\n  --text-h5:         1.3rem;\n  --text-lead:       clamp(1rem, 2vw, 1.3rem);\n  --text-body:       1rem;\n  --text-body-sm:    0.95rem;\n  --text-caption:    0.85rem;\n  --text-label:      0.7rem;\n  --text-label-sm:   0.65rem;\n  --text-ui-lg:      1.5rem;    /* mobile nav */\n  --text-ui-md:      0.85rem;   /* buttons */\n  --text-ui-sm:      0.8rem;    /* nav links */\n  --text-ui-xs:      0.7rem;    /* footer links */\n\n  /* Tracking */\n  --tracking-wide:   0.4em;\n  --tracking-med:    0.25em;\n  --tracking-ui:     0.2em;\n  --tracking-tight:  0.1em;\n\n  /* Line heights */\n  --leading-display: 0.9;\n  --leading-tight:   1.1;\n  --leading-head:    1.2;\n  --leading-body:    1.9;\n  --leading-quote:   1.6;\n  --leading-label:   1.4;\n\n  /* ── SPACING TOKENS ──────────────────────────────────────── */\n  --space-1:   0.25rem;\n  --space-2:   0.5rem;\n  --space-3:   0.75rem;\n  --space-4:   1rem;\n  --space-5:   1.25rem;\n  --space-6:   1.5rem;\n  --space-8:   2rem;\n  --space-10:  2.5rem;\n  --space-12:  3rem;\n  --space-16:  4rem;\n  --space-20:  5rem;\n  --space-24:  6rem;\n  --space-28:  7rem;\n\n  /* Layout */\n  --max-width:       1100px;\n  --section-padding: 7rem 4rem;\n  --section-padding-mobile: 5rem 2rem;\n  --nav-padding:     1.5rem 4rem;\n  --nav-padding-mobile: 1.25rem 2rem;\n\n  /* ── BORDER TOKENS ───────────────────────────────────────── */\n  --radius: 0;         /* NO border-radius anywhere — sharp corners only */\n\n  /* Shadows — not used in this design system */\n  --shadow: none;\n\n  /* ── ANIMATION TOKENS ────────────────────────────────────── */\n  --duration-fast:   0.2s;     /* @kind other */\n  --duration-base:   0.3s;     /* @kind other */\n  --duration-slow:   0.5s;     /* @kind other */\n  --ease-base:       ease;     /* @kind other */\n  --ease-in-out:     ease-in-out; /* @kind other */\n}\n\n/* ── RESET ─────────────────────────────────────────────────── */\n*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\n\n/* ── BASE ──────────────────────────────────────────────────── */\nbody {\n  background: var(--color-bg-primary);\n  color: var(--color-fg-body);\n  font-family: var(--font-body);\n  overflow-x: hidden;\n}\n\n/* Film grain overlay */\nbody::before {\n  content: '';\n  position: fixed; inset: 0;\n  background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E\");\n  pointer-events: none;\n  z-index: 1000;\n  opacity: 0.4;\n}\n\n/* ── DISPLAY TYPE (Playfair Display) ───────────────────────── */\n.t-hero {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: var(--text-hero);\n  line-height: var(--leading-display);\n  color: var(--color-fg-primary);\n}\n\n.t-h1 {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: var(--text-h1);\n  line-height: var(--leading-tight);\n  color: var(--color-fg-primary);\n}\n\n.t-h2 {\n  font-family: var(--font-display);\n  font-weight: 900;\n  font-size: var(--text-h2);\n  line-height: var(--leading-tight);\n  color: var(--color-fg-primary);\n}\n\n.t-h3 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--text-h3);\n  line-height: var(--leading-head);\n  color: var(--color-fg-primary);\n}\n\n.t-h4 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-size: var(--text-h4);\n  line-height: var(--leading-head);\n  color: var(--color-fg-primary);\n}\n\n.t-display-italic {\n  font-family: var(--font-display);\n  font-style: italic;\n  color: var(--brass);\n}\n\n.t-pull-quote {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: var(--text-h5);\n  line-height: var(--leading-quote);\n  color: var(--color-fg-primary);\n}\n\n.t-footer-brand {\n  font-family: var(--font-display);\n  font-weight: 700;\n  font-style: italic;\n  font-size: 1.1rem;\n  color: var(--brass);\n}\n\n/* ── BODY TYPE (Libre Baskerville) ─────────────────────────── */\n.t-lead {\n  font-family: var(--font-body);\n  font-style: italic;\n  font-size: var(--text-lead);\n  line-height: var(--leading-body);\n  color: var(--color-fg-body);\n}\n\n.t-body {\n  font-family: var(--font-body);\n  font-size: var(--text-body);\n  line-height: var(--leading-body);\n  color: var(--color-fg-body);\n}\n\n.t-body-sm {\n  font-family: var(--font-body);\n  font-size: var(--text-body-sm);\n  line-height: var(--leading-body);\n  color: var(--color-fg-body);\n}\n\n.t-caption {\n  font-family: var(--font-body);\n  font-size: var(--text-caption);\n  font-style: italic;\n  line-height: var(--leading-label);\n  color: var(--color-fg-muted);\n}\n\n/* ── UI TYPE (Barlow Condensed) ────────────────────────────── */\n.t-label {\n  font-family: var(--font-ui);\n  font-weight: 600;\n  font-size: var(--text-label);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--color-fg-accent);\n}\n\n.t-label-muted {\n  font-family: var(--font-ui);\n  font-weight: 600;\n  font-size: var(--text-label-sm);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--color-fg-muted);\n}\n\n.t-nav-logo {\n  font-family: var(--font-ui);\n  font-weight: 800;\n  font-size: 1rem;\n  letter-spacing: var(--tracking-med);\n  text-transform: uppercase;\n  color: var(--brass);\n}\n\n.t-nav-link {\n  font-family: var(--font-ui);\n  font-weight: 400;\n  font-size: var(--text-ui-sm);\n  letter-spacing: var(--tracking-ui);\n  text-transform: uppercase;\n  color: var(--color-fg-muted);\n  text-decoration: none;\n  transition: color var(--duration-base);\n}\n.t-nav-link:hover { color: var(--color-fg-primary); }\n\n.t-cta {\n  font-family: var(--font-ui);\n  font-weight: 700;\n  font-size: var(--text-ui-md);\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n}\n\n.t-stat-number {\n  font-family: var(--font-ui);\n  font-weight: 800;\n  font-size: 2.5rem;\n  line-height: 1;\n  color: var(--color-fg-primary);\n}\n\n.t-stat-label {\n  font-family: var(--font-ui);\n  font-size: 0.7rem;\n  letter-spacing: 0.25em;\n  text-transform: uppercase;\n  color: var(--color-fg-muted);\n}\n\n.t-meta-label {\n  font-family: var(--font-ui);\n  font-size: 0.6rem;\n  letter-spacing: 0.35em;\n  text-transform: uppercase;\n  color: var(--color-fg-accent);\n}\n\n.t-meta-value {\n  font-family: var(--font-ui);\n  font-size: 1rem;\n  font-weight: 600;\n  color: var(--color-fg-primary);\n  letter-spacing: 0.05em;\n}\n\n/* ── SECTION LABEL PATTERN ─────────────────────────────────── */\n.section-label {\n  font-family: var(--font-ui);\n  font-weight: 600;\n  font-size: var(--text-label-sm);\n  letter-spacing: var(--tracking-wide);\n  text-transform: uppercase;\n  color: var(--color-fg-accent);\n  display: flex;\n  align-items: center;\n  gap: 1rem;\n}\n.section-label::after {\n  content: '';\n  flex: 1;\n  max-width: 60px;\n  height: 1px;\n  background: var(--ember);\n}\n\n/* ── BUTTONS ───────────────────────────────────────────────── */\n.btn-primary {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-weight: 700;\n  font-size: var(--text-ui-md);\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  color: var(--black);\n  background: var(--ember);\n  border: none;\n  padding: 1rem 2.5rem;\n  text-decoration: none;\n  cursor: pointer;\n  transition: background var(--duration-base), transform var(--duration-fast);\n}\n.btn-primary:hover {\n  background: var(--rust);\n  transform: translateY(-2px);\n}\n\n.btn-secondary {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-weight: 600;\n  font-size: var(--text-label);\n  letter-spacing: 0.25em;\n  text-transform: uppercase;\n  color: var(--ember);\n  text-decoration: none;\n  border-bottom: 1px solid rgba(196, 80, 26, 0.3);\n  padding-bottom: 0.15rem;\n  transition: color var(--duration-fast), border-color var(--duration-fast);\n}\n.btn-secondary:hover {\n  color: var(--white);\n  border-color: var(--white);\n}\n\n.btn-disabled {\n  font-family: var(--font-ui);\n  font-weight: 700;\n  font-size: var(--text-ui-md);\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  background: rgba(154, 144, 136, 0.15);\n  color: var(--ash);\n  border: none;\n  padding: 1rem 2.5rem;\n  cursor: default;\n}\n\n/* ── CARD ──────────────────────────────────────────────────── */\n.card {\n  background: var(--color-bg-card);\n  border: 1px solid var(--color-border-default);\n  transition:\n    border-color var(--duration-base),\n    background var(--duration-base);\n}\n.card:hover {\n  border-color: var(--color-border-hover);\n  background: var(--color-bg-card-hover);\n}\n\n/* ── PULL QUOTE / STAT BLOCK ───────────────────────────────── */\n.pull-quote {\n  border-left: 3px solid var(--ember);\n  padding: 2rem 2rem 2rem 2.5rem;\n  background: var(--color-accent-bg-tint);\n}\n\n.stat-block {\n  border-left: 3px solid var(--ember);\n  padding: 1.25rem 1.5rem;\n  background: var(--color-accent-bg-tint);\n}\n\n/* ── FORM ELEMENTS ─────────────────────────────────────────── */\n.form-input {\n  background: rgba(26, 20, 16, 0.8);\n  border: 1px solid rgba(154, 144, 136, 0.2);\n  color: var(--white);\n  padding: 0.9rem 1rem;\n  font-family: var(--font-body);\n  font-size: 0.9rem;\n  outline: none;\n  transition: border-color var(--duration-base);\n  width: 100%;\n  -webkit-appearance: none;\n}\n.form-input:focus { border-color: var(--ember); }\n\n.form-label {\n  font-family: var(--font-ui);\n  font-size: var(--text-label-sm);\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  color: var(--ash);\n  display: block;\n  margin-bottom: 0.5rem;\n}\n\n/* ── HORIZONTAL RULE ───────────────────────────────────────── */\n.rule {\n  width: 100%;\n  height: 1px;\n  background: linear-gradient(\n    to right,\n    transparent,\n    rgba(139, 58, 26, 0.4),\n    transparent\n  );\n}\n\n/* ── TAGS / BADGES ─────────────────────────────────────────── */\n.tag {\n  font-family: var(--font-ui);\n  font-size: 0.6rem;\n  font-weight: 600;\n  letter-spacing: 0.2em;\n  text-transform: uppercase;\n  padding: 0.2rem 0.6rem;\n  border: 1px solid;\n  display: inline-block;\n}\n.tag-high {\n  color: var(--ember);\n  border-color: rgba(196, 80, 26, 0.45);\n  background: rgba(196, 80, 26, 0.07);\n}\n.tag-medium {\n  color: #7a9fbf;\n  border-color: rgba(122, 159, 191, 0.4);\n  background: rgba(122, 159, 191, 0.07);\n}\n.tag-new {\n  color: var(--brass);\n  border-color: rgba(184, 146, 42, 0.45);\n  background: rgba(184, 146, 42, 0.07);\n}\n.tag-date {\n  color: var(--ash);\n  border-color: rgba(154, 144, 136, 0.25);\n}\n.status-live {\n  font-family: var(--font-ui);\n  font-size: 0.6rem;\n  font-weight: 600;\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  padding: 0.4rem 1rem;\n  display: inline-block;\n  color: #5a9e6f;\n  border: 1px solid rgba(90, 158, 111, 0.4);\n  background: rgba(90, 158, 111, 0.08);\n}\n.status-soon {\n  font-family: var(--font-ui);\n  font-size: 0.6rem;\n  font-weight: 600;\n  letter-spacing: 0.3em;\n  text-transform: uppercase;\n  padding: 0.4rem 1rem;\n  display: inline-block;\n  color: var(--ash);\n  border: 1px solid rgba(154, 144, 136, 0.25);\n}\n\n/* ── SECTION LAYOUT HELPERS ────────────────────────────────── */\n.section-inner {\n  max-width: var(--max-width);\n  margin: 0 auto;\n  padding: var(--section-padding);\n}\n\n/* ── IMAGE TREATMENT ───────────────────────────────────────── */\n.img-archival {\n  filter: sepia(20%) contrast(1.05) brightness(0.9);\n  transition: filter var(--duration-slow);\n}\n.img-archival:hover {\n  filter: sepia(5%) contrast(1.1) brightness(1);\n}\n\n/* ── ANIMATIONS ────────────────────────────────────────────── */\n@keyframes fadeUp {\n  from { opacity: 0; transform: translateY(30px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n@keyframes fadeIn {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}\n@keyframes scrollPulse {\n  0%, 100% { opacity: 0.4; }\n  50%       { opacity: 1; }\n}\n\n/* ── RESPONSIVE ────────────────────────────────────────────── */\n@media (max-width: 900px) {\n  .section-inner { padding: var(--section-padding-mobile); }\n}\n<\u002Fstyle>\n  <script src=\"b947c7ae-b71b-4c91-8bd6-a560f5ca09ae\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--black); overflow-x: hidden; }\n    html { overflow-x: hidden; }\n    ::-webkit-scrollbar { width: 10px; height: 10px; }\n    ::-webkit-scrollbar-track { background: var(--forge); }\n    ::-webkit-scrollbar-thumb { background: var(--rust); }\n    ::-webkit-scrollbar-thumb:hover { background: var(--ember); }\n    a { color: var(--ash); text-decoration: none; }\n    a:hover { color: var(--white); }\n    ::selection { background: rgba(196,80,26,0.3); }\n    .il-code { font-family: 'S LI Command Matrix<\u002Fa>\n        <a href=\"#ref-shortcuts\" class=\"il-navsub\">— Keyboard Shortcuts<\u002Fa>\n\n        <a href=\"#explanation\" class=\"il-navlink\" style=\"margin-top: 0.75rem;\">4. Architecture &amp; Invariants<\u002Fa>\n        <a href=\"#exp-rational\" class=\"il-navsub\">— Zero-Float Rational Arithmetic<\u002Fa>\n      <\u002Fnav>\n    <\u002Faside>\n\n    <main style=\"flex: 1; padding: 3rem 3.5rem 5rem; max-width: 860px; min-width: 0;\">\n\n      <section style=\"padding-bottom: 2.5rem; border-bottom: 1px solid rgba(139,58,26,0.2); margin-bottom: 3.5rem;\">\n        <div style=\"display: flex; gap: 0.6rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap;\">\n          <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.Tag\" variant=\"high\" hint-size=\"auto,24px\">Enterprise Operator Guide<\u002Fx-import>\n          <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.Tag\" variant=\"date\" hint-size=\"auto,24px\">v0.14.0<\u002Fx-import>\n          <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.StatusBadge\" status=\"live\" hint-size=\"auto,24px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <h1 style=\"font-family: 'Playfair Display', serif; font-weight: 900; font-size: 2.75rem; line-height: 1.1; color: var(--white); margin: 0 0 1.25rem;\">IronLedger Operator Guide &amp; Reference<\u002Fh1>\n        <p style=\"font-size: 1.05rem; line-height: 1.7; color: var(--ash); max-width: 640px; margin: 0;\">IronLedger is a local-first financial operating system combining plaintext accounting authority with SQLite projections, exact-rational valuation, compliance Merkle trees, federated event delivery, and read-only MCP tools for tax-lot analysis.<\u002Fp>\n      <\u002Fsection>\n\n      <section id=\"tutorial\" style=\"margin-bottom: 4rem;\">\n        <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.SectionLabel\" hint-size=\"100%,32px\">01 — Quickstart Tutorial<\u002Fx-import>\n        <div style=\"display: flex; flex-direction: column; gap: 1rem; margin-top: -1.5rem;\">\n          <div id=\"tutorial-step1\" class=\"il-card\">\n            <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); margin: 0 0 0.9rem;\">1. Ingest Statement Records<\u002Fh3>\n            <pre class=\"il-code\" style=\"margin: 0; padding: 0.9rem 1.1rem; background: var(--black); border: 1px solid rgba(139,58,26,0.3); color: var(--brass); font-size: 0.78rem; overflow-x: auto; white-space: pre;\">python -m ironledger.cli import inbox/checking_export.ofx --confirm \"import inbox/checking_export.ofx\"<\u002Fpre>\n          <\u002Fdiv>\n          <div id=\"tutorial-step2\" class=\"il-card\">\n            <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); margin: 0 0 0.9rem;\">2. Review &amp; Approve in Operator Workbench<\u002Fh3>\n            <pre class=\"il-code\" style=\"margin: 0; padding: 0.9rem 1.1rem; background: var(--black); border: 1px solid rgba(139,58,26,0.3); color: var(--brass); font-size: 0.78rem; overflow-x: auto; white-space: pre;\">python -m ironledger.cli web --port 8000<\u002Fpre>\n          <\u002Fdiv>\n          <div id=\"tutorial-step3\" class=\"il-card\">\n            <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); margin: 0 0 0.9rem;\">3. Portfolio, Tax Lots &amp; Capital Gains<\u002Fh3>\n            <pre class=\"il-code\" style=\"margin: 0; padding: 0.9rem 1.1rem; background: var(--black); border: 1px solid rgba(139,58,26,0.3); color: var(--brass); font-size: 0.78rem; overflow-x: auto; white-space: pre;\">python -m ironledger.cli mcp --db &lt;db&gt; --ledger-dir ledger --bind 127.0.0.1 --port 8765\npython -m ironledger.cli prices poll --ledger-dir ledger<\u002Fpre>\n          <\u002Fdiv>\n          <div id=\"tutorial-step4\" class=\"il-card\">\n            <h3 style=\"font-family: 'Barlow Condensed', sans-serif; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); margin: 0 0 0.9rem;\">4. Federated Outbox Delivery<\u002Fh3>\n            <pre class=\"il-code\" style=\"margin: 0; padding: 0.9rem 1.1rem; background: var(--black); border: 1px solid rgba(139,58,26,0.3); color: var(--brass); font-size: 0.78rem; overflow-x: auto; white-space: pre;\">python -m ironledger.cli federation outbox dispatch --worker-id worker_prod_1 --batch-size 50<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"how-to\" style=\"margin-bottom: 4rem;\">\n        <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.SectionLabel\" hint-size=\"100%,32px\">02 — How-To Guides<\u002Fx-import>\n        <div style=\"display: flex; flex-direction: column; gap: 1rem; margin-top: -1.5rem;\">\n          <div id=\"how-to-portfolio\" class=\"il-card\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 0.9rem;\">How to Manage Multi-Asset Holdings &amp; Watchlist Pricing<\u002Fh3>\n            <ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; color: var(--ash); font-size: 0.92rem; line-height: 1.6;\">\n              <li style=\"padding-left: 1.2rem; position: relative;\"><span style=\"position: absolute; left: 0; color: var(--ember);\">—<\u002Fspan><strong style=\"color: var(--bone);\">Watchlist Guard:<\u002Fstrong> In the Workbench <em>Holdings &amp; Watchlist<\u002Fem> view, click the <strong style=\"color: var(--bone);\">Lock Guard<\u002Fstrong> button to toggle edit mode before adding or removing symbols.<\u002Fli>\n              <li style=\"padding-left: 1.2rem; position: relative;\"><span style=\"position: absolute; left: 0; color: var(--ember);\">—<\u002Fspan><strong style=\"color: var(--bone);\">Add Symbols:<\u002Fstrong> Supply base symbol (e.g. <code class=\"il-code\" style=\"color: var(--brass);\">NVDA<\u002Fcode>), quote currency (<code class=\"il-code\" style=\"color: var(--brass);\">USD<\u002Fcode>), and optional fallback price.<\u002Fli>\n              <li style=\"padding-left: 1.2rem; position: relative;\"><span style=\"position: absolute; left: 0; color: var(--ember);\">—<\u002Fspan><strong style=\"color: var(--bone);\">Remove Symbols:<\u002Fstrong> Click the 🗑 trash button on any unlocked symbol row, or delete from <code class=\"il-code\" style=\"color: var(--brass);\">config/prices.json<\u002Fcode>.<\u002Fli>\n              <li style=\"padding-left: 1.2rem; position: relative;\"><span style=\"position: absolute; left: 0; color: var(--ember);\">—<\u002Fspan><strong style=\"color: var(--bone);\">On-Demand Sync:<\u002Fstrong> Click <strong style=\"color: var(--bone);\">Sync Watchlist<\u002Fstrong> to scrape live quotes and refresh valuation tables.<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <div id=\"how-to-sankey\" class=\"il-card\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 0.9rem;\">How to Inspect Cash Flow Sankey Diagrams<\u002Fh3>\n            <p style=\"color: var(--ash); font-size: 0.92rem; line-height: 1.6; margin: 0;\">The Sankey visualizer renders directed cash flow linkages from Income accounts through Operating Buffer to Expenses and Asset allocations for any <code class=\"il-code\" style=\"color: var(--brass);\">YYYY-MM<\u002Fcode> period.<\u002Fp>\n          <\u002Fdiv>\n          <div id=\"how-to-compliance\" class=\"il-card\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 0.9rem;\">How to Generate and Verify Compliance Audit Bundles<\u002Fh3>\n            <pre class=\"il-code\" style=\"margin: 0; padding: 0.9rem 1.1rem; background: var(--black); border: 1px solid rgba(139,58,26,0.3); color: var(--brass); font-size: 0.78rem; overflow-x: auto; white-space: pre;\">python -m ironledger.cli compliance generate --ledger-id default --framework SOC2_TYPE2 --out bundle.tar\npython -m ironledger.cli compliance verify --bundle bundle.tar<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"reference\" style=\"margin-bottom: 4rem;\">\n        <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.SectionLabel\" hint-size=\"100%,32px\">03 — Technical Reference<\u002Fx-import>\n        <div style=\"display: flex; flex-direction: column; gap: 1rem; margin-top: -1.5rem;\">\n          <div id=\"ref-api\" class=\"il-card\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 1.1rem;\">REST API Catalog<\u002Fh3>\n            <sc-raw-table class=\"il-code\" style=\"width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: left;\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"border-bottom: 1px solid rgba(154,144,136,0.2);\">\n                  <sc-raw-th style=\"padding: 0 0 0.6rem; color: var(--ash); font-weight: 400;\">Method<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"padding: 0 0 0.6rem; color: var(--ash); font-weight: 400;\">Endpoint<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"padding: 0 0 0.6rem; color: var(--ash); font-weight: 400;\">Description<\u002Fsc-raw-th>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-raw-tr style=\"border-bottom: 1px solid rgba(154,144,136,0.08);\"><sc-raw-td style=\"padding: 0.55rem 0; color: #5a9e6f; font-weight: 700;\">GET<\u002Fsc-raw-td><sc-raw-td style=\"padd t: 700;\">GET<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.55rem 0; color: var(--brass);\">/api/analytics/sankey?period=YYYY-MM<\u002Fsc-raw-td><sc-raw-td style=\"padding: 0.55rem 0; color: var(--ash);\">Directed cash flow link matrix<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n\n          <div id=\"ref-cli\" class=\"il-card\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 0.9rem;\">CLI Command Matrix<\u002Fh3>\n            <pre class=\"il-code\" style=\"margin: 0; padding: 0.9rem 1.1rem; background: var(--black); border: 1px solid rgba(139,58,26,0.3); color: var(--brass); font-size: 0.78rem; overflow-x: auto; white-space: pre;\">python -m ironledger.cli web --port 8000\npython -m ironledger.cli prices poll --ledger-id default\npython -m ironledger.cli prices sync --symbols AAPL MSFT BTC\npython -m ironledger.cli compile --dry-run\npython -m ironledger.cli compile --confirm \"authorize compile\"<\u002Fpre>\n          <\u002Fdiv>\n\n          <div id=\"ref-shortcuts\" class=\"il-card\">\n            <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 1.1rem;\">Keyboard Shortcuts<\u002Fh3>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.6rem;\">\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: var(--ember); font-weight: 700;\">j<\u002Fkbd> Next row<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: var(--ember); font-weight: 700;\">k<\u002Fkbd> Previous row<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: #5a9e6f; font-weight: 700;\">a<\u002Fkbd> Approve staged<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: #b8412f; font-weight: 700;\">x<\u002Fkbd> Reject staged<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: var(--ember); font-weight: 700;\">Ctrl+K<\u002Fkbd> Command Palette<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: var(--ember); font-weight: 700;\">Ctrl+R<\u002Fkbd> Rule Wizard<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: var(--ember); font-weight: 700;\">Ctrl+S<\u002Fkbd> Simulate<\u002Fdiv>\n              <div class=\"il-code\" style=\"padding: 0.6rem 0.8rem; background: var(--black); border: 1px solid rgba(154,144,136,0.15); font-size: 0.78rem; color: var(--ash);\"><kbd style=\"color: var(--ember); font-weight: 700;\">Ctrl+Enter<\u002Fkbd> Compile<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"explanation\" style=\"margin-bottom: 2rem;\">\n        <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.SectionLabel\" hint-size=\"100%,32px\">04 — Architecture &amp; Invariants<\u002Fx-import>\n        <div id=\"exp-rational\" class=\"il-card\" style=\"margin-top: -1.5rem;\">\n          <h3 style=\"font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; color: var(--white); margin: 0 0 0.9rem;\">Zero-Float Exact Rational Arithmetic<\u002Fh3>\n          <p style=\"color: var(--ash); font-size: 0.92rem; line-height: 1.6; margin: 0;\">Enforced by static AST verification: zero float type annotations or float arithmetic in financial calculations. Exact Numerator/Denominator representation guarantees audit reproducibility without IEEE 754 precision drift.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <x-import component-from-global-scope=\"CastIronCharlieDesignSystem_019de1.GradientRule\" hint-size=\"100%,1px\"><\u002Fx-import>\n      <footer style=\"display: flex; align-items: center; justify-content: space-between; padding-top: 1.5rem; font-family: 'Barlow Condensed', sans-serif; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ash); flex-wrap: wrap; gap: 0.5rem;\">\n        <div>IronLedger Enterprise Financial Operating System<\u002Fdiv>\n        <div>Local-first · Beancount + SQLite Authority<\u002Fdiv>\n      <\u002Ffooter>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
